name: Build Xaga 6.12 Kernel & Modules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      modules_only:
        description: 'Build modules only'
        type: boolean
        default: true

jobs:
  build:
    name: Compile 6.12 Modules
    runs-on: ubuntu-24.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout Modules Repository
        uses: actions/checkout@v4
        with:
          path: modules

      - name: Checkout Kernel Base Repository
        uses: actions/checkout@v4
        with:
          repository: RengokuSensei/android_kernel_oddo_mt6895
          ref: xaga-6.12
          path: kernel

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev libncurses-dev \
            device-tree-compiler python3 python3-pip make gcc g++ \
            tar gzip xz-utils zstd ccache libarchive-tools curl wget \
            lz4 cpio unzip binutils-aarch64-linux-gnu

      - name: Fetch AOSP Clang Toolchain (r536225)
        run: |
          echo "Cloning AOSP Clang r536225..."
          git clone --depth=1 https://gitlab.com/kei-space/clang/r536225.git $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Compile 6.12 Modules via build.sh
        run: |
          cd modules
          chmod +x build.sh
          export K="$GITHUB_WORKSPACE/kernel"
          export M="$GITHUB_WORKSPACE/modules/kernel_device_modules-6.12"
          export LLVM_PREFIX="$HOME/clang"
          export JOBS=$(nproc)
          ./build.sh --modules-only

      - name: Collect Compiled Kernel Modules (.ko)
        if: always()
        run: |
          mkdir -p output/modules
          find modules -name "*.ko" -exec cp {} output/modules/ \;
          echo "Total compiled modules:"
          ls -1 output/modules | wc -l

      - name: Upload Kernel Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xaga-6.12-kernel-modules
          path: output/modules/
          if-no-files-found: error
